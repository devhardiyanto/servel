name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.gen.outputs.changelog }}
      prerelease: ${{ steps.flag.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: gen
        shell: bash
        run: |
          set -e
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG="$(git describe --tags --abbrev=0 "${CURRENT_TAG}^" 2>/dev/null || echo '')"
          if [ -z "$PREV_TAG" ]; then
            RANGE="${CURRENT_TAG}"
            LOG="$(git log --pretty='* %s' "$CURRENT_TAG")"
          else
            RANGE="${PREV_TAG}..${CURRENT_TAG}"
            LOG="$(git log --pretty='* %s' "$RANGE")"
          fi
          {
            echo "changelog<<EOF"
            echo "## What's Changed"
            echo ""
            echo "$LOG"
            echo ""
            echo "**Range:** \`${RANGE}\`"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Gagal lebih awal dengan pesan jelas, sebelum 4 build berjalan.
      - name: Check updater signing setup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q 'GANTI_DENGAN_ISI_SERVEL_KEY_PUB' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey di src-tauri/tauri.conf.json masih penanda. Isi dengan isi file servel.key.pub."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY belum dipasang."
            exit 1
          fi

      - name: Detect prerelease
        id: flag
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" =~ -(beta|rc|alpha) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Draft dibuat SEKALI di sini. Sebelumnya tiap job matrix membuatnya
      # sendiri, dan job yang start bersamaan menghasilkan draft ganda
      # (kasus v2.5.0). Job build hanya mengunggah ke release_id ini.
      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            ${{ steps.gen.outputs.changelog }}

            ## Install

            - **Windows:** download `.exe` (NSIS installer), run, follow prompts.
            - **macOS:** download `.dmg`, open, drag Servel.app to Applications.
            - **Linux:** download `.AppImage`, `chmod +x`, run.

            See [README](https://github.com/${{ github.repository }}#readme) for prerequisites (Windows: WSL 3.0.1+ for built-in WSL containers, or Docker Desktop; macOS/Linux: Docker).
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          # Re-run workflow: pakai draft yang sudah ada untuk tag ini.
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
            --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id // empty")"
          if [ -z "$ID" ]; then
            PRE=""
            if [ "${{ steps.flag.outputs.prerelease }}" = "true" ]; then PRE="--prerelease"; fi
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft $PRE \
              --title "Servel ${TAG}" --notes "$NOTES" --verify-tag
            ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=50" \
              --jq "[.[] | select(.tag_name == \"${TAG}\")][0].id")"
          fi
          echo "release_id=${ID}" >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - os: macos-latest
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            rust-target: x86_64-apple-darwin
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-${{ matrix.rust-target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.rust-target }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build & publish release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.changelog.outputs.release_id }}
          args: --target ${{ matrix.rust-target }}
