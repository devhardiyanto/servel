name: release

# Dua cara memulai rilis:
#   1. Actions → release → "Run workflow" pada main. Tag v<versi> dibuat dari
#      versi di src-tauri/tauri.conf.json, jadi tag dan versi tidak bisa beda.
#   2. Push tag v*.*.* secara manual. Run berhenti di langkah pertama bila tag
#      tidak sama dengan versi di tauri.conf.json (kasus v3.1.0 dan v3.2.1:
#      tag dibuat sebelum PR versi di-merge).
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.flag.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve tag and check it matches the app version
        id: tag
        shell: bash
        run: |
          set -e
          VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Run this workflow from main (got ${GITHUB_REF})."
              exit 1
            fi
            TAG="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              TAGGED="$(git rev-list -n 1 "${TAG}")"
              if [ "$TAGGED" != "$GITHUB_SHA" ]; then
                echo "::error::Tag ${TAG} already exists on ${TAGGED}, not on main (${GITHUB_SHA}). Bump the version first, or delete the tag."
                exit 1
              fi
              echo "Tag ${TAG} already points at ${GITHUB_SHA}."
            else
              git tag "${TAG}" "${GITHUB_SHA}"
              git push origin "refs/tags/${TAG}"
              echo "Created tag ${TAG} at ${GITHUB_SHA}."
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            if [ "$TAG" != "v${VERSION}" ]; then
              echo "::error::Tag ${TAG} does not match version ${VERSION} in src-tauri/tauri.conf.json. Was the tag pushed before the version PR was merged? Delete the tag and push it again from the merged commit."
              exit 1
            fi
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Isi draft: catatan docs/releases/ untuk semua versi sejak tag
      # sebelumnya (rilis gabungan mendapat semuanya), commit, cara instal.
      # Lihat scripts/release-notes.sh. Draft disunting manual sebelum publish.
      - name: Generate release notes
        id: gen
        shell: bash
        env:
          CURRENT_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          bash scripts/release-notes.sh "$CURRENT_TAG" > "$RUNNER_TEMP/notes.md"
          echo "notes_file=$RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"
          {
            echo "## Draft notes for ${CURRENT_TAG}"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

      # Gagal lebih awal dengan pesan jelas, sebelum 4 build berjalan.
      - name: Check updater signing setup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if grep -q 'GANTI_DENGAN_ISI_SERVEL_KEY_PUB' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey di src-tauri/tauri.conf.json masih penanda. Isi dengan isi file servel.key.pub."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY belum dipasang."
            exit 1
          fi

      - name: Detect prerelease
        id: flag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if [[ "${TAG}" =~ -(beta|rc|alpha) ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Draft dibuat SEKALI di sini. Sebelumnya tiap job matrix membuatnya
      # sendiri, dan job yang start bersamaan menghasilkan draft ganda
      # (kasus v2.5.0). Job build hanya mengunggah ke release_id ini.
      - name: Create draft release
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          NOTES_FILE: ${{ steps.gen.outputs.notes_file }}
        run: |
          set -e
          # Re-run workflow: pakai rilis yang sudah ada untuk tag ini.
          # (Endpoint per-tag tidak melihat draft, jadi cari di daftar.)
          ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq "map(select(.tag_name == \"${TAG}\")) | .[0].id // empty")"
          if [ -z "$ID" ]; then
            # ID diambil dari respons pembuatan. Daftar rilis bisa belum
            # memuat draft yang baru dibuat (v2.11.0: release_id kosong,
            # tauri-action melewati semua upload).
            ID="$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$TAG" \
              -f name="Kova ${TAG}" \
              -F body=@"$NOTES_FILE" \
              -F draft=true \
              -F prerelease=${{ steps.flag.outputs.prerelease }} \
              --jq .id)"
          fi
          if ! [[ "$ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not get a release id for ${TAG} (got '${ID}')."
            exit 1
          fi
          echo "Release id for ${TAG}: ${ID}"
          echo "release_id=${ID}" >> "$GITHUB_OUTPUT"

  release:
    needs: changelog
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
          - os: macos-latest
            rust-target: aarch64-apple-darwin
          - os: macos-latest
            rust-target: x86_64-apple-darwin
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Setup Node 20
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo registry + target
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ matrix.os }}-${{ matrix.rust-target }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.rust-target }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Build & publish release via tauri-action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.changelog.outputs.release_id }}
          args: --target ${{ matrix.rust-target }}
          # latest.json disusun sekali oleh job updater-manifest. Bila tiap
          # job menulisnya sendiri, job yang selesai bersamaan saling menimpa
          # (v3.2.0: job gagal 404, lalu latest.json hanya memuat 4 platform).
          includeUpdaterJson: false

  # Menyusun latest.json dari berkas .sig yang sudah diunggah keempat build.
  # Gagal bila ada platform yang hilang, sehingga manifest tidak pernah
  # terbit separuh.
  updater-manifest:
    needs: [changelog, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and upload latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.changelog.outputs.release_id }}
          TAG: ${{ needs.changelog.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" > release.json
          mkdir sigs
          jq -r '.assets[] | select(.name | endswith(".sig")) | "\(.id)\t\(.name)"' release.json |
          while IFS=$'\t' read -r id name; do
            gh api -H "Accept: application/octet-stream" \
              "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" > "sigs/${name}"
          done
          python3 scripts/updater-manifest.py \
            --version "${TAG#v}" \
            --repo "${GITHUB_REPOSITORY}" \
            --release release.json --sigs sigs --out latest.json
          cat latest.json
          OLD="$(jq -r '.assets[] | select(.name == "latest.json") | .id' release.json)"
          if [ -n "$OLD" ]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${OLD}"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=latest.json" \
            > /dev/null
          echo "latest.json uploaded for ${TAG}."
