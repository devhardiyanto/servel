name: Bug report
description: Report a reproducible bug in Kova.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out the form below so we can reproduce and fix it quickly.

  - type: input
    id: version
    attributes:
      label: Kova version
      description: Shown at the bottom-right of the app, or in Settings → About.
      placeholder: "v3.15.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Ubuntu/Debian)
        - Linux (Fedora/RHEL)
        - Linux (Arch)
        - Linux (other)
    validations:
      required: true

  - type: input
    id: engine
    attributes:
      label: Container engine
      description: WSL containers or Docker Engine, with its version (Settings → About → Diagnostics → Copy info lists it).
      placeholder: "Docker Engine 29.1 + Compose 2.40"

  - type: input
    id: mise
    attributes:
      label: mise version
      description: Only if the bug is about Runtimes or PHP extensions. Shown at the top-right of Runtimes.
      placeholder: "2026.11.12"

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Open Kova
        2. Toggle MySQL ON
        3. Click tray "Start selected services"
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "MySQL container should start and badge turn green."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: "Badge stays amber, log shows 'port already allocated' error."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste log lines from the Logs Viewer or terminal output. Use code blocks.
      render: shell

  - type: checkboxes
    id: prereq-check
    attributes:
      label: Prerequisites
      options:
        - label: I have searched existing issues and confirmed this is not a duplicate.
          required: true
        - label: I am on the latest Kova release.
          required: true
