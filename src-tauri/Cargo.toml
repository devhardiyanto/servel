[package]
name = "servel"
version = "2.7.0"
description = "One app. All your local dev environment."
authors = ["devhardiyanto <dev.hardiyanto@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "servel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
notify-debouncer-mini = "0.4"
sha2 = "0.10"
tauri-plugin-updater = "2"
# Token acak untuk kanal kontrol CLI (v2.5).
getrandom = "0.2"
# Unduh extension PECL (v2.6). Sama dengan yang dipakai tauri-plugin-updater:
# rustls + ring, tanpa backend TLS baru.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_System_Diagnostics_Debug",
  # Job object: dev server ikut mati bila Servel mati paksa (v2.3).
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[dev-dependencies]
# `tauri::test::mock_app` untuk menguji start/stop dev server tanpa jendela.
tauri = { version = "2", features = ["test"] }
